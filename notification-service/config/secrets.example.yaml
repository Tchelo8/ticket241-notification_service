# Modèle des secrets de notification-service (versionné, SANS valeurs).
#
# En local : copier ce fichier en config/application.yaml (ignoré par Git) et remplir les valeurs.
# Sur un serveur : définir les variables d'environnement indiquées à la place.
#
# Générer une clé (PowerShell) :
#   $b = New-Object byte[] 32; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b); [Convert]::ToBase64String($b)
spring:
  datasource:
    # Variable d'environnement : DB_PASSWORD
    password: <DB_PASSWORD>
  mail:
    # Variable d'environnement : MAIL_PASSWORD
    # Mot de passe d'application Gmail (compte Google → Sécurité → Mots de passe des applications)
    password: <MAIL_PASSWORD>
notification:
  otp:
    # Variable d'environnement : OTP_HASH_SECRET
    # Le changer invalide les codes OTP en cours (5 min de validité)
    hash-secret: <OTP_HASH_SECRET>
  internal:
    # Variable d'environnement : INTERNAL_API_KEY
    # IDENTIQUE dans auth-service, notification-service et ticket-service
    api-key: <INTERNAL_API_KEY>
